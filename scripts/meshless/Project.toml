# Nested env for meshless comparison scripts (Macchiato / RBF-FD / WhatsThePoint).
# These packages are not part of the BEM teaching environment.
#
#   julia --project=scripts/meshless -e 'using Pkg; Pkg.instantiate()'
#   julia --project=scripts/meshless scripts/macchiato_heat_compare.jl

[deps]
BEM = "fa9a2255-4635-4715-9e52-f44f730e9c4c"
DrWatson = "634d3b9d-ee7a-5ddf-bec9-22491ea816e1"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Macchiato = "cd40ceae-7681-4e2e-9056-ba6e356aca3e"
OrdinaryDiffEq = "1dea7af3-3e70-54e6-95c3-0bf5283fa5ed"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
RadialBasisFunctions = "79ee0514-adf7-4479-8807-6f72ea8967e8"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Unitful = "1986cc42-f94f-5a68-af5c-568840ba703d"
WhatsThePoint = "5faae8f1-f507-432f-bd56-cf2f1161ab6f"

[sources]
BEM = {path = "../.."}
Macchiato = {rev = "main", url = "https://github.com/JuliaMeshless/Macchiato.jl"}

[compat]
Macchiato = "0.2.1"
OrdinaryDiffEq = "7.3.0"
RadialBasisFunctions = "0.7.1"
Unitful = "1.28.0"
WhatsThePoint = "0.3.1"
julia = "1.10"
